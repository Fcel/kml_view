name: kemal
description: KeMaL — Google Earth altlığı üzerinde KML görüntüleyici. WhatsApp ve diğer uygulamalardan KML dosyası açma, GPS takip.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google Maps
  google_maps_flutter: ^2.9.0

  # Konum / GPS
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Dosya seçici (manuel yükleme)
  file_picker: ^8.1.2

  # WhatsApp ve diğer uygulamalardan dosya alma
  receive_sharing_intent: ^1.8.0

  # KML/XML parse
  xml: ^6.5.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
