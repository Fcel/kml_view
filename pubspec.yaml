name: kml_view
description: Google Earth altlığı üzerinde KML görüntüleyici - GPS destekli
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google Maps
  google_maps_flutter: ^2.9.0

  # Konum / GPS
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Dosya seçici
  file_picker: ^8.1.2

  # KML/XML parse
  xml: ^6.5.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_speed_dial: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
